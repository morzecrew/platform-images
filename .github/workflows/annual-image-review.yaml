name: Annual Image Review

# RFC 0003 decision 6 (LOCKED): the annual review is opened by a scheduled
# workflow, not by a calendar promise. Its own words -- "a self-opening issue is
# the difference between a review that happens and a calendar promise that does
# not" -- are the reason this file exists.
#
# 8 January rather than the 1st: an issue opened on a public holiday is read in
# February. The RFC says the month matters, not the day.
#
# KNOWN LIMITATION, and it is the one that would silently defeat this workflow:
# GitHub disables scheduled workflows in public repositories after 60 days
# without repository activity. An *annual* cron is the schedule most exposed to
# that -- and a repository quiet for a year is precisely when an unused-image
# review matters most, so the mechanism is weakest in the case it exists for.
#
# The mitigation is manual and worth knowing before January: re-enable with
# `gh workflow enable "Annual Image Review"` (or the Actions UI), then run the
# review immediately with the workflow_dispatch trigger below rather than
# waiting another year. See EXECUTION-LOG D-055 and R-36.

on:
  schedule:
    - cron: "0 9 8 1 *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the issue body to the log instead of opening it
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: annual-image-review
  cancel-in-progress: false

jobs:
  open-review:
    runs-on: ubuntu-latest
    name: Open the review issue

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Identified by title rather than by label, so the workflow does not have
      # to create and maintain a label as a side effect -- `gh issue create
      # --label` fails outright when the label does not exist, which would make
      # a first run depend on repository state nobody set up (D-056).
      - name: Refuse to open a duplicate
        id: dupe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --limit 50 \
            --json number,title \
            --jq '[.[] | select(.title | startswith("Annual image review"))] | .[0].number // ""')"
          if [ -n "${existing}" ]; then
            echo "::notice title=Review already open::#${existing} is open; not opening another"
            echo "skip=true" >>"${GITHUB_OUTPUT}"
          else
            echo "skip=false" >>"${GITHUB_OUTPUT}"
          fi

      # Derived from the bake file, never hand-written. A hand-maintained list
      # would drift from what is actually published, and an image missing from
      # the review is an image that is never retired (D-040's lesson).
      #
      # What gets searched is the *published reference*, not the target name.
      # `postgres-cron` publishes as `ghcr.io/morzecrew/postgres:18.6-cron`, so
      # searching for `ghcr.io/morzecrew/postgres-cron` searches a string that
      # has never existed and reports "none found" no matter who uses it (R-35).
      #
      # stderr is NOT suppressed: with `set -euo pipefail` a failing bake aborts
      # the step at the assignment, so a guard below it never runs, and hiding
      # stderr would remove the only explanation from the log (R-34).
      - name: Collect the published references
        if: steps.dupe.outputs.skip == 'false'
        id: images
        run: |
          set -euo pipefail
          docker buildx bake --print >plan.json || {
            echo "::error title=Bake failed::docker buildx bake --print failed; see the log above"
            exit 1
          }
          python3 - <<'PY' >plan.tsv
          import collections, json

          targets = json.load(open("plan.json"))["target"]
          refs = {n: (t.get("tags") or [None])[0] for n, t in targets.items()}
          refs = {n: r for n, r in refs.items() if r}

          # Two searches, because one cannot answer both questions.
          #
          # The PACKAGE path answers the retirement question -- is this image
          # used at all -- and it matches every tag a consumer might pin. It has
          # to: three projects reference `postgres` on tags older than the
          # current one, so searching only the current tag reports "none found"
          # for an image with consumers.
          #
          # The exact TAG is what separates targets sharing one package (the
          # RFC 0004 variants all publish under `postgres`), where the package
          # path would credit every variant with the base image's consumers.
          # Emitted only for those, since elsewhere it adds a column of noise.
          shared = collections.Counter(r.split(":")[0] for r in refs.values())

          for name in sorted(refs):
              ref = refs[name]
              image = ref.split(":")[0]
              tag = ref if shared[image] > 1 else ""
              print(f"{name}\t{image}\t{tag}")
          PY
          [ -s plan.tsv ] || { echo "::error title=No targets::bake produced no tagged targets"; exit 1; }
          cat plan.tsv

      # RFC 0003 decision 5 (ASSUMED): the review reads consuming repositories,
      # NOT GHCR pull counts -- a scheduled CI job pulling an image is a pull
      # count, not a user. So this searches code, and there is deliberately no
      # call to the packages API anywhere in this file.
      #
      # GITHUB_TOKEN cannot search other repositories, so the scan needs a token
      # with org-wide read. When that secret is absent the issue says the scan
      # did not run and names the secret, rather than opening a blank checklist
      # that reads as "no consumers found".
      - name: Scan consuming repositories
        if: steps.dupe.outputs.skip == 'false'
        id: scan
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          SELF: ${{ github.repository }}
        run: |
          set -euo pipefail
          : >evidence.tsv
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "scanned=false" >>"${GITHUB_OUTPUT}"
            echo "::warning title=Consumer scan skipped::ORG_READ_TOKEN is not set; the issue will say so"
            exit 0
          fi
          # search <query> -> repositories, "__error__", or "__truncated__"
          search() {
            local raw
            raw="$(gh api -X GET search/code \
              -f q="\"$1\" org:morzecrew" -f per_page=100 2>/dev/null)" || raw=""
            if [ -z "${raw}" ]; then
              printf '__error__'
              return
            fi
            printf '%s' "${raw}" | jq -r --arg self "${SELF}" '
              (.total_count // 0) as $n
              | ([.items[].repository.full_name] | unique | map(select(. != $self))) as $repos
              | if $n > 100 then "__truncated__" else ($repos | join(", ")) end'
          }

          while IFS=$'\t' read -r name image tag; do
            [ -n "${name}" ] || continue
            # Code search is rate-limited well below the REST API; pace it
            # rather than losing the tail of the list to a 403.
            sleep 7
            image_hits="$(search "${image}")"
            tag_hits=""
            if [ -n "${tag}" ]; then
              sleep 7
              tag_hits="$(search "${tag}")"
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "${name}" "${image}" "${tag}" "${image_hits}" "${tag_hits}" >>evidence.tsv
          done <plan.tsv
          echo "scanned=true" >>"${GITHUB_OUTPUT}"
          cat evidence.tsv

      - name: Compose the issue
        if: steps.dupe.outputs.skip == 'false'
        id: compose
        env:
          SCANNED: ${{ steps.scan.outputs.scanned }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >body.md
          import os, pathlib

          scanned = os.environ["SCANNED"] == "true"

          plan = []
          for line in pathlib.Path("plan.tsv").read_text().splitlines():
              if line.strip():
                  name, image, tag = line.split("\t")
                  plan.append((name, image, tag))

          evidence = {}
          p = pathlib.Path("evidence.tsv")
          if p.exists():
              for line in p.read_text().splitlines():
                  if line.strip():
                      name, _image, _tag, image_hits, tag_hits = line.split("\t")
                      evidence[name] = (image_hits, tag_hits)

          def cell(hits, scanned):
              if not scanned:
                  return "_not scanned_"
              if hits == "__error__":
                  return "⚠️ scan failed"
              if hits == "__truncated__":
                  return "⚠️ >100 hits, truncated — check by hand"
              return hits if hits else "**none found**"

          print("Opened automatically. RFC 0003 decision 6.\n")
          print("Two questions, and the second is easy to forget:\n")
          print("1. **Does a live project reference this image?** One whose only")
          print("   consumer is this repository -- a builder used by no downstream")
          print("   project -- is retired even if it builds cleanly (RFC 0003 §4.2).")
          print("2. **Does a live project reimplement an image we already publish?**")
          print("   A hit is feedback about the image, not a violation by the project.")
          print("   The useful output is *why* they did not adopt it (decision 10).\n")
          print("**The bar is one year without a project consumer** (§4.1). Outcomes")
          print("are keep or retire; there is no \"keep for now\", which is the state")
          print("that produces images nobody has used since 2024.\n")
          print("Evidence is consuming repositories, **not GHCR pull counts**: a")
          print("scheduled CI job pulling an image is a pull count, not a user")
          print("(decision 5). Nothing here queries the packages API.\n")
          print("---\n")

          if scanned:
              print("### Images, with a starting-point scan\n")
              print("**It is a starting point, not the answer.** It greps the org for")
              print("each published reference, so it misses consumers that pull by")
              print("digest or build the reference from a variable, it cannot see")
              print("outside the organisation, and it cannot tell a live project from")
              print("an abandoned one.\n")
          else:
              print("### Images\n")
              print("> [!WARNING]")
              print("> **The consumer scan did not run.** `ORG_READ_TOKEN` is not set,")
              print("> and `GITHUB_TOKEN` cannot search other repositories. The column")
              print("> below is unmeasured -- it means *nobody looked*, not *nobody")
              print("> uses it*.\n")

          print("| Image | Package | Package referenced by | This variant's tag | Keep or retire? |")
          print("|---|---|---|---|---|")
          for name, image, tag in plan:
              image_hits, tag_hits = evidence.get(name, ("", ""))
              variant = cell(tag_hits, scanned) if tag else "—"
              print(f"| `{name}` | `{image}` | {cell(image_hits, scanned)} | {variant} | |")

          if any(t for _n, _i, t in plan):
              print("\n**Two columns, because one cannot answer both questions.** The")
              print("package column is the retirement signal -- it matches every tag a")
              print("consumer might pin, including versions older than the current one.")
              print("The variant column appears only where several targets share one")
              print("package, and it says whether *that specific tag* is referenced; a")
              print("package with consumers can still have a variant nobody picked.\n")

          print("\n---\n")
          print("### If anything is retired\n")
          print("The checklist is RFC 0003 §4.3, and step 5 is the one that gets missed:\n")
          print("1. Announce in the image's README that the tag is frozen, with a date.")
          print("2. Remove the bake target, its variable, and its `default` group entry.")
          print("3. Remove the row from the root README images table.")
          print("4. Delete `images/<name>/`.")
          print("5. **Leave `<name>` in `cleanup-images.yaml`'s `PACKAGES`** -- the")
          print("   published package still exists and its untagged children still need")
          print("   collecting.")
          print("6. Decide the published package's fate explicitly: **freeze** (default)")
          print("   or **delete**, recorded in the PR (§4.4).\n")
          print("Steps 2-4 are one PR. Git history keeps the Dockerfile, so retirement")
          print("costs nothing irreversible -- which is the argument that makes it easy")
          print("to agree to.\n")
          print("See [RFC 0003](../blob/main/rfcs/0003-image-admission-and-retirement-rule.md)")
          print("and [images/README.md](../blob/main/images/README.md).")
          PY
          echo "--- issue body ---"
          cat body.md

      - name: Open the issue
        if: steps.dupe.outputs.skip == 'false' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Decision 6 says the owner is whoever the issue is assigned to at open
          # time, which presumes an assignee it never names. This makes that true
          # rather than aspirational; RFC 0003 row 12 records the literal default
          # and the post-creation timing.
          ASSIGNEE: ${{ vars.REVIEW_ASSIGNEE || 'Misery7100' }}
        run: |
          set -euo pipefail
          url="$(gh issue create \
            --title "Annual image review — $(date -u +%Y)" \
            --body-file body.md)"
          echo "opened: ${url}"
          # Assigned after creation, not during: an assignee who is no longer a
          # collaborator would otherwise fail the whole command and lose the
          # issue, which is a worse outcome than an unassigned one.
          gh issue edit "${url}" --add-assignee "${ASSIGNEE}" \
            || echo "::warning title=Not assigned::could not assign ${ASSIGNEE}; assign the issue by hand"
          echo "::notice title=Annual review opened::${url}"
