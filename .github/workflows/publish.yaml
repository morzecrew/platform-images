name: Build and Publish Images

on:
  push:
    branches:
      - main
    paths:
      - docker-bake.hcl
      - images/**
      - shared/**
      - .github/workflows/publish.yaml
      - "!images/**/README.md"
      - "!shared/README.md"
      - "!README.md"

  # Mondays 05:00 UTC, an hour AFTER cleanup-images (04:00) -- and the order is
  # load-bearing, in the opposite direction to the obvious one.
  #
  # Between the digest push and the tag promotion below, a healthy build exists
  # in GHCR as an *untagged* version, which is exactly what cleanup deletes. The
  # two workflows are in different concurrency groups, so nothing serialises
  # them; this offset is the only thing keeping cleanup out of that window. If
  # the rebuild ran first and overran its hour -- five uncached images, easily --
  # cleanup would delete an image that was moments from being promoted.
  #
  # The cost is that a *genuine* orphan, from a run that died mid-flight, waits
  # until the following Monday to be collected. That is a week of unreferenced
  # bytes, which is storage rather than a fault, and it is the cheaper mistake.
  schedule:
    - cron: "0 5 * * 1"

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # For the scheduled-rebuild failure issue (S-0001/D-8).
  issues: write

# Shared with cleanup-images.yaml, and that sharing is the actual safety
# mechanism rather than the cron offset above.
#
# Between the digest push and the tag promotion below, a healthy build exists in
# GHCR as an untagged version, which is exactly what cleanup deletes. The cron
# offset only separates the two *scheduled* runs; this workflow also fires on
# push and workflow_dispatch, and cleanup fires on workflow_dispatch too, so a
# merge landing at 03:59 Monday or a manually dispatched cleanup walks straight
# into that window. A group shared across both workflows is what actually
# serialises them -- concurrency groups are repository-scoped, not per-workflow.
#
# cancel-in-progress stays false on both: cancelling a publish mid-promotion is
# the failure this exists to prevent.
concurrency:
  group: ghcr-mutations
  cancel-in-progress: false

jobs:
  # The target list the legs fan out over. Refused here, before anything
  # builds, when a target has no smoke script: such an image is a publishing
  # run that cannot honour S-0001/D-6, and discovering that after pushing a
  # dozen digests wastes the run.
  #
  # Resolved from each target's context rather than from its name. A postgres
  # extension variant is its own target sharing the base image's directory, so
  # `images/<target>/smoke.sh` does not exist for it and the old check refused
  # every variant on sight.
  plan:
    runs-on: ubuntu-24.04
    name: Plan
    outputs:
      targets: ${{ steps.targets.outputs.targets }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: List the targets, each with its smoke test
        id: targets
        run: |
          set -euo pipefail
          plan="$(docker buildx bake --print)"
          targets="$(printf '%s' "${plan}" \
            | python3 -c 'import json,sys; print(" ".join(sorted(json.load(sys.stdin)["target"])))')"
          for t in ${targets}; do
            script="$(printf '%s' "${plan}" | python3 -c \
              "import json,sys,pathlib; print(pathlib.PurePath(json.load(sys.stdin)['target']['${t}']['context'], 'smoke.sh'))")"
            [ -f "${script}" ] || {
              echo "::error title=No smoke test::${t} has no ${script}; refusing to publish"
              exit 1
            }
          done
          echo "targets: ${targets}"
          printf 'targets=%s\n' "$(printf '%s' "${plan}" \
            | python3 -c 'import json,sys; print(json.dumps(sorted(json.load(sys.stdin)["target"])))')" \
            >>"${GITHUB_OUTPUT}"

  # One leg per target and platform, each on a native runner rather than one
  # runner under QEMU: caddy compiles Go, uv-builder exists to compile wheels,
  # and an emulated arm64 smoke test exercises the emulator as much as the
  # image. Each leg runs the gate's first two passes for its target on its
  # platform; promote runs the third once every leg has passed. The legs run
  # side by side, so a run takes as long as its slowest image.
  build:
    needs: plan
    strategy:
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    name: ${{ matrix.target }} (${{ matrix.platform.arch }})
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.platform.arch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Publishing authenticates with the explicit tokens below; the
          # checkout token is never used, and nothing here runs git.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Both engines need credentials: buildx pushes the digest, Podman pulls it
      # back to smoke-test it.
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | docker login ghcr.io -u dummy --password-stdin
          echo "${GH_TOKEN}" | podman login ghcr.io -u dummy --password-stdin

      # The gate, in three passes (S-0001/D-6; this shape was measured to keep
      # attestations end to end). This step is the first two, for one target on
      # one platform:
      #
      #   1. build   -- push by digest with tags cleared, so nothing is
      #                 reachable by name until it has passed
      #   2. smoke   -- pull that exact digest back and run the image's script
      #                 on the platform it was built for
      #   3. promote -- the promote job, below
      #
      # GIT_REVISION / BUILD_DATE default to empty in docker-bake.hcl so local
      # builds stay cache-stable; CI fills them in.
      - name: Build and smoke-gate
        env:
          GIT_REVISION: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          export BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # The scheduled rebuild exists to pick up a rebuilt base layer, which
          # a cached build cannot do (S-0001/D-8). Push-triggered runs stay
          # cached and fast.
          nocache=""
          if [ "${EVENT}" = "schedule" ]; then
            nocache="--no-cache"
            echo "scheduled rebuild: building with --no-cache"
          fi

          plan="$(docker buildx bake --print "${TARGET}")"
          script="$(printf '%s' "${plan}" | python3 -c \
            "import json,sys,pathlib; print(pathlib.PurePath(json.load(sys.stdin)['target']['${TARGET}']['context'], 'smoke.sh'))")"
          repo="$(printf '%s' "${plan}" | python3 -c \
            "import json,sys; print(json.load(sys.stdin)['target']['${TARGET}']['tags'][0].rsplit(':', 1)[0])")"

          # Clearing tags is required as well as overriding output: without it
          # bake refuses with "can't push tagged ref by digest".
          echo "::group::build ${TARGET} (linux/${ARCH})"
          docker buildx bake ${nocache} \
            --set "${TARGET}.platform=linux/${ARCH}" \
            --set "${TARGET}.tags=" \
            --set "${TARGET}.output=type=registry,name=${repo},push-by-digest=true,name-canonical=true" \
            --metadata-file /tmp/meta.json "${TARGET}"
          echo "::endgroup::"

          digest="$(python3 -c \
            "import json; print(json.load(open('/tmp/meta.json'))['${TARGET}']['containerimage.digest'])")"
          ref="${repo}@${digest}"
          echo "${TARGET}: ${ref}"

          podman pull "${ref}"
          bash "${script}" "${ref}"

          # Written only after the smoke test passed, so promote never sees a
          # digest from a leg that failed part-way.
          mkdir -p "/tmp/digests/${ARCH}"
          printf '%s' "${digest}" >"/tmp/digests/${ARCH}/${TARGET}"

      - name: Hand the tested digest to promote
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.platform.arch }}-${{ matrix.target }}
          path: /tmp/digests/
          if-no-files-found: error
          retention-days: 1

  # The third pass. imagetools create joins each target's per-platform digests
  # into one index and points the tags at it. It does not rebuild: the index is
  # new, but every platform manifest and attestation in it is the one a leg
  # smoke-tested on its own platform, by digest.
  #
  # Promotion is its own job rather than per-leg or per-target, so one image
  # failing its smoke test on either platform cannot leave anything published.
  promote:
    needs: build
    runs-on: ubuntu-latest
    name: Promote
    outputs:
      subjects: ${{ steps.promote.outputs.subjects }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GH_TOKEN}" | docker login ghcr.io -u dummy --password-stdin

      - name: Collect the tested digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: /tmp/digests
          # Every leg's artifact holds <arch>/<target>, so merged they give one
          # directory per platform.
          merge-multiple: true

      # BUILD_STAMP must be unique per *build*, not per run (S-0001/D-4).
      # Neither run_id nor run_number changes when a run is re-run --
      # only run_attempt does -- and a re-run rebuilds from moved apt/base
      # state, so without it a second attempt repoints a tag called immutable.
      - name: Promote
        id: promote
        run: |
          set -euo pipefail

          export BUILD_STAMP="$(date -u +%Y%m%d)-${{ github.run_id }}.${{ github.run_attempt }}"

          plan="$(docker buildx bake --print)"
          targets=$(printf '%s' "${plan}" \
            | python3 -c 'import json,sys; print(" ".join(sorted(json.load(sys.stdin)["target"])))')

          # Every target is checked before any is tagged, in two halves.
          #
          # Each leg's digest must carry what S-0001/D-5 promises: an SPDX SBOM
          # and mode=max provenance. Counting attestation manifests is not
          # enough -- BuildKit attaches min-mode provenance by default, so a
          # bake file whose `attest` stopped applying (the shorthand failure)
          # still yields one per platform. Only max records `buildConfig`.
          #
          # The dry run then prints the index that would be pushed. It must hold
          # both platforms, and each attestation must reference one of them, so
          # a merge cannot drop a platform or pair an attestation with the
          # wrong image.
          declare -A SOURCES
          for t in ${targets}; do
            repo="$(printf '%s' "${plan}" | python3 -c \
              "import json,sys; print(json.load(sys.stdin)['target']['${t}']['tags'][0].rsplit(':', 1)[0])")"
            refs=()
            for leg in /tmp/digests/*/; do
              ref="${repo}@$(cat "${leg}${t}")"
              refs+=("${ref}")
              docker buildx imagetools inspect "${ref}" \
                --format '{"provenance": {{json .Provenance}}, "sbom": {{json .SBOM}}}' | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          slsa = (d['provenance'] or {}).get('SLSA') or {}
          assert 'buildConfig' in slsa.get('buildDefinition', {}).get('internalParameters', {}), '${ref}: provenance is not mode=max'
          assert 'SPDX' in (d['sbom'] or {}), '${ref}: no SPDX SBOM'
          "
            done
            docker buildx imagetools create --dry-run "${refs[@]}" | python3 -c "
          import json, sys
          m = json.load(sys.stdin)['manifests']
          att = [x for x in m if x.get('annotations', {}).get('vnd.docker.reference.type') == 'attestation-manifest']
          img = [x for x in m if x not in att]
          plats = sorted(x['platform']['architecture'] for x in img)
          assert plats == ['amd64', 'arm64'], '${t}: platforms %s' % plats
          refd = sorted(x['annotations']['vnd.docker.reference.digest'] for x in att)
          assert refd == sorted(x['digest'] for x in img), '${t}: attestations reference %s, not one per platform' % refd
          "
            SOURCES["${t}"]="${refs[*]}"
          done

          subjects=()
          for t in ${targets}; do
            mapfile -t tags < <(printf '%s' "${plan}" | python3 -c \
              "import json,sys; print('\n'.join(json.load(sys.stdin)['target']['${t}']['tags']))")
            args=()
            for tag in "${tags[@]}"; do args+=(--tag "${tag}"); done
            read -ra refs <<<"${SOURCES[${t}]}"
            echo "::group::promote ${t} -> ${tags[*]}"
            docker buildx imagetools create "${args[@]}" "${refs[@]}"
            # The index every tag above now names: what a consumer pins, so
            # what the attest job signs. Nothing else moves these tags while
            # this run holds the ghcr-mutations group.
            digest="$(docker buildx imagetools inspect "${tags[0]}" --format '{{.Manifest.Digest}}')"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::${t}: index digest '${digest}'"; exit 1; }
            subjects+=("${t} ${tags[0]%:*} ${digest}")
            echo "::endgroup::"
          done

          printf 'subjects=%s\n' "$(printf '%s\n' "${subjects[@]}" | python3 -c \
            'import json,sys; print(json.dumps([dict(zip(("target", "name", "digest"), l.split())) for l in sys.stdin]))')" \
            >>"${GITHUB_OUTPUT}"
          echo "published: ${targets}"

  # S-0005: a signed SLSA provenance statement for each promoted index,
  # bound to this workflow's identity through Sigstore, so a consumer can check
  # that a digest it is about to pin came from publish.yaml on main. It sits
  # beside the unsigned BuildKit attestations and replaces nothing.
  #
  # A job of its own because the action signs one subject per call, and only
  # this job holds id-token: write. It runs after the tags move, since the
  # index has no digest before `imagetools create` pushes it. A failure fails
  # the run, and a consumer verifying the digest refuses it until a re-run of
  # the failed jobs attests it.
  attest:
    needs: promote
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.promote.outputs.subjects) }}
    runs-on: ubuntu-latest
    name: Attest ${{ matrix.target }}
    # Replaces the workflow's set for this job: no issues: write here.
    permissions:
      contents: read
      packages: write # push-to-registry writes the bundle into the package
      id-token: write # the OIDC token Sigstore certifies the signing key against
      attestations: write # the bundle is also stored in this repository's attestations

    steps:
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GH_TOKEN}" | docker login ghcr.io -u dummy --password-stdin

      # push-to-registry stores the bundle in GHCR as a referrer of the index,
      # which cleanup-images keeps as the index's child, as well as in this
      # repository's attestations, which `gh attestation verify` reads by default.
      - name: Attest the index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.name }}
          subject-digest: ${{ matrix.digest }}
          push-to-registry: true
          # A storage record feeds the organization's Linked Artifacts page,
          # which nothing here reads, and needs artifact-metadata: write.
          create-storage-record: false

  # Scheduled failures are the silent ones -- nobody watches a cron the way
  # they watch their own push -- and S-0001/D-8 makes this notification a
  # precondition for the schedule existing at all.
  #
  # One reused issue, not one per week: fifty-two open issues describing the
  # same broken rebuild is a mailing list, not a signal.
  report-failure:
    needs: [build, promote, attest]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    name: Report scheduled rebuild failure

    steps:
      - name: Report scheduled rebuild failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh cannot infer the repository.
          GH_REPO: ${{ github.repository }}
          TITLE: Weekly image rebuild is failing
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf '%s\n' \
            "The scheduled rebuild failed on $(date -u +%Y-%m-%d)." \
            "" \
            "Run: ${run_url}" \
            "" \
            "While this is failing, the mutable \`:<version>\` tags keep serving" \
            "their last successful bytes. Consumers are not broken -- they are" \
            "silently not receiving base-image security updates, which is the" \
            "condition this rebuild exists to prevent." \
            "" \
            "Closing this issue is the signal that the rebuild is healthy again.")

          # Exact title match against the open issue list rather than --search,
          # which is index-backed and can lag a fresh issue by long enough to
          # file a duplicate.
          existing="$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == env.TITLE) | .number] | first // empty")"

          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
            echo "commented on existing issue #${existing}"
          else
            gh issue create --title "${TITLE}" --body "${body}"
            echo "opened a new issue"
          fi
