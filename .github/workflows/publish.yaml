name: Build and Publish Images

on:
  push:
    branches:
      - main
    paths:
      - docker-bake.hcl
      - images/**
      - justfile
      - .github/workflows/publish.yaml
      - "!images/**/README.md"
      - "!README.md"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    name: Build and Publish Images
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Publishing authenticates with the explicit GH_TOKEN below; the
          # checkout token is never used, and `just publish` runs no git
          # commands, so persisting it only widens what a build step can read.
          persist-credentials: false

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # GIT_REVISION / BUILD_DATE / BUILD_STAMP default to empty in
      # docker-bake.hcl so local builds stay cache-stable; CI fills them in.
      #
      # BUILD_STAMP uses run_id, not run_number: a re-run keeps its number, and
      # reusing a stamp would repoint the tag the tag policy calls immutable.
      - name: Publish images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_REVISION: ${{ github.sha }}
        run: |
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          BUILD_STAMP="$(date -u +%Y%m%d)-${{ github.run_id }}" \
          just publish