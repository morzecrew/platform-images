name: Bake Images (build only)

on:
  pull_request:
    branches: [main]
    paths:
      - docker-bake.hcl
      - images/**
      - shared/**
      - .github/workflows/bake.yaml
      # The bake-argument check and its own test: a change to the check alone
      # has to run it.
      - .github/scripts/**
      - "!images/**/README.md"
      - "!shared/README.md"
      - "!README.md"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bake-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks that need no image, and the target list the legs fan out over.
  # These are seconds, they fail for reasons that are legible on their own, and
  # a broken helper would otherwise surface as a container that will not start.
  # None of them depends on the platform, so they run once.
  plan:
    runs-on: ubuntu-24.04
    name: Plan and check
    outputs:
      targets: ${{ steps.targets.outputs.targets }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This job runs code from the PR head. A checkout-managed token left
          # in .git/config would be readable by all of it, and nothing here
          # pushes.
          persist-credentials: false

      - name: Test the shared env-config helper
        run: sh shared/test/run.sh -v

      # S-0002/D-1: every bake target named after its directory has to keep its
      # Dockerfile's ARG defaults in step with the values the bake passes, so a
      # Renovate move that edits one copy and leaves the other fails here rather
      # than in an image built off the bake.
      - name: Test the bake-argument check
        run: bash .github/scripts/test-arg-defaults.sh

      - name: Check bake argument defaults
        run: bash .github/scripts/arg-defaults.sh

      # Driven by targets, not by directories. Iterating images/*/smoke.sh tests
      # one image per directory, which silently skips any target sharing a
      # directory with another -- every RFC 0004 extension variant. A target's
      # context *is* its image directory, and a variant inherits it, so
      # `bake --print` already answers "which script tests this target" with no
      # naming convention to get wrong. publish.yaml resolves it the same way.
      - name: List the targets, each with its smoke test
        id: targets
        run: |
          set -euo pipefail
          plan="$(docker buildx bake --print)"
          targets="$(printf '%s' "${plan}" \
            | python3 -c 'import json,sys; print(" ".join(sorted(json.load(sys.stdin)["target"])))')"
          failed=0
          for t in ${targets}; do
            script="$(printf '%s' "${plan}" | python3 -c \
              "import json,sys,pathlib; print(pathlib.PurePath(json.load(sys.stdin)['target']['${t}']['context'], 'smoke.sh'))")"
            [ -f "${script}" ] || {
              echo "::error title=No smoke test::${t} has no ${script}"
              failed=1
            }
          done
          [ "${failed}" -eq 0 ]
          echo "targets: ${targets}"
          printf 'targets=%s\n' "$(printf '%s' "${plan}" \
            | python3 -c 'import json,sys; print(json.dumps(sorted(json.load(sys.stdin)["target"])))')" \
            >>"${GITHUB_OUTPUT}"

  # One leg per target and platform, each on a native runner, so an image that
  # builds or starts on amd64 only fails here rather than in the publish run.
  # The legs run side by side: a run takes as long as its slowest image rather
  # than the sum of them all.
  bake:
    needs: plan
    strategy:
      # One leg failing says nothing about the others; cancelling them would
      # hide whether a fix is needed once or several times.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.target }} (${{ matrix.runner }})
    env:
      TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This job builds and runs code from the PR head. A checkout-managed
          # token left in .git/config would be readable by all of it, and
          # nothing here pushes.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # One build, smoke-tested in the same job. A separate smoke job would have
      # to build again -- images do not cross job boundaries without an
      # artifact upload -- so the thing smoke-tested would not be the thing the
      # build step verified.
      #
      # uv-builder's leg also builds python-distroless: build-uv-app's test
      # below runs this commit's builder output on this commit's runtime.
      #
      # `type=oci`, not `type=docker`: every target inherits `_attested`, and
      # attestations make the result a manifest list, which the docker exporter
      # refuses outright ("does not support exporting manifest lists"). Exporting
      # OCI keeps CI on the same artifact shape publish produces -- dropping
      # attestations here would mean the smoke stage tests something the registry
      # never sees. Podman resolves the runnable manifest and ignores the
      # attestation one on load.
      #
      # One tag per tarball, the first: a target with two (uv-builder's minor
      # and patch) exports an index naming one image twice, which `podman load`
      # refuses ("payload does not match any of the supported image formats").
      # Every later step refers to an image by its first tag.
      #
      # --allow: the tarball lands outside the bake context, which buildx treats
      # as a privileged filesystem write and refuses without an explicit grant.
      # Scoped to the one directory rather than BUILDX_BAKE_ENTITLEMENTS_FS=0,
      # which would switch the check off wholesale.
      - name: Build and load into Podman
        run: |
          set -euo pipefail
          builds="${TARGET}"
          if [ "${TARGET}" = uv-builder ]; then builds="${builds} python-distroless"; fi
          for t in ${builds}; do
            tag="$(docker buildx bake --print "${t}" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['target']['${t}']['tags'][0])")"
            docker buildx bake --allow=fs.write=/tmp --set "${t}.tags=${tag}" \
              --set "${t}.output=type=oci,dest=/tmp/img-${t}.tar" "${t}"
            podman load -i "/tmp/img-${t}.tar"
            rm -f "/tmp/img-${t}.tar"
          done
          podman images

      # Rootless rather than Docker: rootless is where UID mapping, volume
      # ownership and sub-1024 port binds actually fail, and those are the
      # assumptions Docker hides until a customer's air-gapped install finds
      # them. Podman is present on both runner images without setup.
      - name: Smoke test
        run: |
          set -euo pipefail
          plan="$(docker buildx bake --print "${TARGET}")"
          script="$(printf '%s' "${plan}" | python3 -c "import json,sys,pathlib; print(pathlib.PurePath(json.load(sys.stdin)['target']['${TARGET}']['context'], 'smoke.sh'))")"
          ref="$(printf '%s' "${plan}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['target']['${TARGET}']['tags'][0])")"
          bash "${script}" "${ref}"

      # RFC 0004 §6's build-mechanism tests. They cannot live in smoke.sh, which
      # gets one built image: two assert that a bad PG_EXTENSIONS *fails the
      # build*, and the third needs an image without cron, which no shipped
      # variant is. §6 calls that one the test that must never be skipped.
      #
      # Two of the three cost nothing -- the validation they exercise happens in
      # the first RUN layer, so they build with type=cacheonly and no exporter.
      # The third is a full build, which the postgres build above has warmed.
      - name: Test the extension mechanism
        if: matrix.target == 'postgres'
        run: bash images/postgres/test-extensions.sh

      # RFC 0009 §6's battery for build-js-app. Same reason it cannot live in
      # smoke.sh: it needs fixture projects, builds that must *fail*, and a
      # second image to serve the result. The script builds its own npm-builder.
      #
      # In caddy's leg, so the handoff is served by the caddy this commit built
      # rather than the published tag: that is the pair this change would ship,
      # and a published tag can lack the runner's platform (caddy had no arm64
      # until the change adding it was published).
      - name: Test build-js-app
        if: matrix.target == 'caddy'
        run: |
          set -euo pipefail
          CADDY_REF="$(docker buildx bake --print caddy \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["target"]["caddy"]["tags"][0])')" \
            bash images/npm-builder/test-build-js-app.sh

      # build-uv-app's deps/app split needs two builds and a second image, the
      # python-distroless the result would ship on. Both are this commit's.
      - name: Test build-uv-app's two layers
        if: matrix.target == 'uv-builder'
        run: |
          set -euo pipefail
          ref() {
            docker buildx bake --print "$1" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['target']['$1']['tags'][0])"
          }
          UV_BUILDER_REF="$(ref uv-builder)" DISTROLESS_REF="$(ref python-distroless)" \
            bash images/uv-builder/test-build-uv-app.sh

  # The check the main ruleset requires, by the name it requires. A matrix leg
  # reports as "<target> (<runner>)", which no ruleset entry names, so this one
  # job stands for all of them and keeps its name when the matrix changes.
  # `always()` is load-bearing: a required check that is skipped counts as
  # passed, so without it a failed leg would read as green here. plan is named
  # too: when it fails, the legs are skipped, and skipped is not success.
  required:
    needs: [plan, bake]
    if: always()
    runs-on: ubuntu-latest
    name: Bake Images (build only)

    steps:
      - name: Every leg passed
        env:
          PLAN: ${{ needs.plan.result }}
          BAKE: ${{ needs.bake.result }}
        run: test "${PLAN}" = success && test "${BAKE}" = success
