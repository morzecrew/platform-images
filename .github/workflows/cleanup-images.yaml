name: Cleanup Untagged Images

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would be deleted
        type: boolean
        default: true
      packages:
        description: Comma-separated package names (empty = every target in docker-bake.hcl)
        type: string
        default: ""
      older_than:
        description: 'Only touch versions older than this, e.g. "30 days" (empty = any age)'
        type: string
        default: ""

  schedule:
    - cron: "0 4 * * 1"

# All registry access uses GHCR_CLEANUP_TOKEN; GITHUB_TOKEN needs nothing here.
permissions: {}

# Shared with publish.yaml, deliberately. A gated publish is untagged between
# its digest push and its tag promotion, and this job deletes untagged versions
# -- so the two must never run at once. Splitting this group back out reopens
# that race, and neither workflow's schedule is what prevents it.
concurrency:
  group: ghcr-mutations
  cancel-in-progress: false

env:
  # Targets of docker-bake.hcl; keep in sync when adding an image.
  PACKAGES: flyway,caddy,postgres,uv-builder,python-distroless

jobs:
  cleanup:
    runs-on: ubuntu-latest
    name: Cleanup Untagged Images

    steps:
      # Deleting versions of an org-owned package is only allowed for a classic PAT
      # with read:packages + delete:packages. GITHUB_TOKEN and fine-grained tokens
      # get 404 on every DELETE, which the cleanup action reports as "already
      # deleted" -- a green run that removed nothing. Fail up front instead.
      - name: Verify token can delete packages
        env:
          GH_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN }}
        run: |
          scopes=$(gh api -i /user 2>/dev/null | tr -d '\r' | sed -n 's/^[Xx]-[Oo][Aa]uth-[Ss]copes: //p')
          echo "Token scopes: ${scopes:-<none>}"
          case ",${scopes// /}," in
            *,delete:packages,*) ;;
            *) echo "::error::GHCR_CLEANUP_TOKEN must be a classic PAT with read:packages + delete:packages"; exit 1 ;;
          esac

      # Untagged versions are not junk by default: buildx pushes an OCI index per
      # tag whose platform manifest and provenance attestation both show up as
      # untagged. This action resolves those children and keeps them.
      - name: Delete untagged versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          owner: ${{ github.repository_owner }}
          packages: ${{ inputs.packages || env.PACKAGES }}
          delete-untagged: true
          delete-orphaned-images: true
          older-than: ${{ inputs.older_than }}
          validate: true
          # Empty on a scheduled run, which is the point: cron deletes for real.
          dry-run: ${{ inputs.dry_run || false }}
