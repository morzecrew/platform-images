# Opt-in: copy or mount into /opt/coraza/overrides/. See the README's "WAF".
#
# Allows MongoDB-style operators ($and, $like, $in, ...) anywhere in a request.
# CRS rule 942290 refuses them as MongoDB injection, which is what they are to
# a MongoDB backend; an API whose filter grammar uses them needs this, and then
# validates them itself.
SecAction "id:200101,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=942290"
