# Opt-in: copy or mount into /opt/coraza/overrides/. See the README's "WAF".
#
# Skips every CRS rule for the password fields of a JSON body (json.<name>) or
# a form or query string (<name>). A strong password trips the XSS and SQLi
# rules (941100, 941110, 941160, 942100) with `<`, `>` or quotes. Top-level
# fields only: a nested one is json.<parent>.<name>, and needs a line of its own.
SecAction "id:200102,phase:1,pass,t:none,nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.current_password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.new_password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:current_password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:new_password"
