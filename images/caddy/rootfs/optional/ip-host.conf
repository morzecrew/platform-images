# Opt-in: copy or mount into /opt/coraza/overrides/. See the README's "WAF".
#
# Allows a numeric IP in the Host header. CRS rule 920350 scores 3 for one on
# every request, so a deployment reached by IP, before it has DNS, is one more
# warning away from 403: a bodiless POST (920180) is enough.
SecAction "id:200100,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=920350"
