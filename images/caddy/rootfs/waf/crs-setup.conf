# ---- OWASP CRS minimal setup (safe defaults) ----

# Paranoia level:
# 1 = minimum false positives (recommended to start from here)
# 2-4 = stricter, more false positives
SecAction "id:210000,phase:1,pass,nolog,setvar:tx.paranoia_level=1"

# Anomaly thresholds:
# The lower, the more aggressive blocking.
# For "cut the trash" usually ok: inbound 5, outbound 4.
SecAction "id:210010,phase:1,pass,nolog,setvar:tx.inbound_anomaly_score_threshold=5"
SecAction "id:210011,phase:1,pass,nolog,setvar:tx.outbound_anomaly_score_threshold=4"
