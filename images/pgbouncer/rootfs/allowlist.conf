# [pgbouncer] settings settable via PGBOUNCER_CONF__<key>.
#
# Spelling here is the spelling written into pgbouncer.ini -- this file is the
# authority (RFC 0001 §5.1). PGBOUNCER_CONF__MAX_PREPARED_STATEMENTS and
# PGBOUNCER_CONF__max_prepared_statements both match `max_prepared_statements`
# below and both render as `max_prepared_statements`, because matching is
# normalized and emitting is not.
#
# Keys a curated PGBOUNCER_* variable also writes are listed here on purpose:
# either channel may set them, and setting *both* aborts naming both (RFC 0001
# decision 11). Leaving them out would make the passthrough channel lie about
# what it accepts.
#
# A key that is not on this list is refused at startup, naming the key.
# Keys refused even if someone added them here are in denylist.conf.
#
# The names come from the settings table in doc/config.md at the PgBouncer
# release this image bakes (1.26). Nothing here is derived, because the
# spellings are not derivable: `max_client_conn` and `max_db_connections` are
# one keyword each, `server_round_robin` is not `round_robin`.

# --- the curated pairs; see images/pgbouncer/README.md ---
listen_addr
listen_port
auth_type
pool_mode
max_client_conn
default_pool_size
admin_users
stats_users
max_prepared_statements

# --- the pool shape, baked without a curated variable ---
# An operator reaches these through this channel only.
min_pool_size
reserve_pool_size
reserve_pool_timeout
max_db_connections
max_db_client_connections
max_user_connections
max_user_client_connections
server_round_robin
pool_idle_timeout

# --- authentication, beyond the single user this image writes ---
# auth_query and its companions are a coherent alternative to auth_file: with
# them the password lives in Postgres rather than in the file the entrypoint
# writes. Reaching the query path without its user is what would be surprising,
# so the four travel together.
auth_user
auth_query
auth_dbname
auth_ldap_options
scram_iterations

# --- startup parameters and client identity ---
ignore_startup_parameters
track_extra_parameters
disable_pqexec
application_name_add_host

# --- connection sanity checks, and timeouts ---
server_reset_query
server_reset_query_always
server_check_delay
server_check_query
server_fast_close
server_lifetime
server_idle_timeout
server_connect_timeout
server_login_retry
client_login_timeout
autodb_idle_timeout
query_timeout
query_wait_timeout
cancel_wait_timeout
client_idle_timeout
idle_transaction_timeout
transaction_timeout
query_wait_notify
login_notify_message

# --- name resolution ---
dns_max_ttl
dns_nxdomain_ttl
dns_zone_check_period
resolv_conf

# --- TLS toward clients ---
client_tls_sslmode
client_tls_key_file
client_tls_cert_file
client_tls_ca_file
client_tls_protocols
client_tls_ciphers
client_tls13_ciphers
client_tls_ecdhcurve
client_tls_dheparams

# --- TLS toward Postgres ---
server_tls_sslmode
server_tls_ca_file
server_tls_key_file
server_tls_cert_file
server_tls_protocols
server_tls_ciphers
server_tls13_ciphers

# --- low-level network settings ---
pkt_buf
max_packet_size
listen_backlog
sbuf_loopcnt
so_reuseport
tcp_defer_accept
tcp_socket_buffer
tcp_keepalive
tcp_keepcnt
tcp_keepidle
tcp_keepintvl
tcp_user_timeout

# --- what the pooler logs ---
# Where it logs is not settable: see denylist.conf.
log_connections
log_disconnections
log_pooler_errors
log_stats
verbose
stats_period