# Settings nobody may set through PGBOUNCER_CONF__*, regardless of the
# allowlist. A denylisted key aborts startup in **both** strict modes --
# PGBOUNCER_CONF_STRICT=ignore governs unknown keys, not forbidden ones.
#
# Each entry is here because setting it would make some guarantee this image
# makes untrue, not because it is dangerous in general.

# The entrypoint runs pgbouncer as the uid the image was built to run as, and
# that is what the k8s securityContext, the file modes and the writable paths
# are all sized for. A pooler that drops to another uid at runtime invalidates
# every one of them at once.
user

# The credentials file, and the two files that would replace it. The
# entrypoint writes this file on every start from PGBOUNCER_DB_USER and
# PGBOUNCER_DB_PASSWORD; pointing the running config somewhere else means
# PgBouncer authenticates against a file this image never reviewed. Pointing
# it back at the same path is not worth a special case -- auth_query is the
# supported way to take passwords out of this file.
auth_file
auth_hba_file
auth_ident_file

# Where the log goes. The container's contract with its operator is that the
# pooler's output is on stderr, where the runtime collects it -- that is what
# makes `kubectl logs` show a refusal this image printed before starting. A
# logfile, or syslog, moves it somewhere the operator's tooling is not looking.
logfile
syslog

# PgBouncer's own pidfile is for daemonization, which a container does not do:
# PID 1 is the pooler, and a second pidfile is a second thing claiming to say
# where it is.
pidfile

# The socket the pooler listens on. Empty is baked in, so the container is
# reached over TCP and nothing connects through a path inside the container
# that the host cannot see. Setting a directory re-enables that socket, with
# its own permissions and its own trust boundary.
unix_socket_dir

# Peering. peer_id, service_name and job_name make this pooler part of a
# cluster of poolers that route to each other, which changes what `SHOW
# PEERS`/`SHOW POOLS` mean and which server a client lands on. A pooler
# admitted as one container in front of one Postgres does not silently become
# a member of a quorum.
peer_id
service_name
job_name