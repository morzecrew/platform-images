# Upstream settings settable via RUSTFS_CONF__<key>.
#
# The spelling here is the spelling exported -- this file is the authority
# (RFC 0001 §5.1). Upstream owns every RUSTFS_* name, so an entry is an
# upstream name minus its RUSTFS_ prefix, and RUSTFS_CONF__region,
# RUSTFS_CONF__REGION and RUSTFS_CONF__Region all match `REGION` and all export
# RUSTFS_REGION, because matching is normalized and emitting is not.
#
# `VOLUMES`, the credential names and the unsafe switches are refused outright
# in denylist.conf, whatever this file says.
#
# An entry the operator may set is not the same as an entry it is wise to set:
# the allowlist is a guard rail against typos and drift, not a security
# boundary (RFC 0001 §5.1). It is the curated set an operator reaches by name,
# and it deliberately stops short of internals -- the internode, allocator,
# object-lock, drive-health and per-backend audit/notification namespaces are
# not here.

# --- identity and placement ---
REGION
LOCAL_ENDPOINT_HOST
UNSUPPORTED_FS_POLICY

# --- console; CONSOLE_ENABLE is curated, see images/rustfs/README.md ---
CONSOLE_ADDRESS
CONSOLE_PREFIX
CONSOLE_CORS_ALLOWED_ORIGINS
CONSOLE_AUTH_TIMEOUT
CONSOLE_RATE_LIMIT_ENABLE
CONSOLE_RATE_LIMIT_RPM
