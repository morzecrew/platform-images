# Settings nobody may reach through RUSTFS_CONF__*, regardless of the
# allowlist. A denylisted key aborts startup in **both** strict modes --
# RUSTFS_CONF_STRICT=ignore governs unknown keys, not forbidden ones.
#
# Each entry is here because setting it would make some guarantee this image
# makes untrue, not because it is dangerous in general.

# The data directory is the image's contract with its volume mount. Moving it
# silently strands existing data at the old path, and the base image's /data
# volume is the one the README documents.
VOLUMES

# The credentials have their own channel with their own checks: required, not
# empty, not upstream's built-in default, and aborting on an unreadable file.
# Reaching them here would walk past every one of those.
ACCESS_KEY
ACCESS_KEY_FILE
SECRET_KEY
SECRET_KEY_FILE

# Upstream's pre-rename credential aliases. The entrypoint refuses the
# variables themselves; refusing the passthrough spelling keeps the two
# channels from disagreeing about what is accepted.
ROOT_USER
ROOT_PASSWORD
ROOT_USER_FILE
ROOT_PASSWORD_FILE
MINIO_ROOT_USER
MINIO_ROOT_PASSWORD
MINIO_ROOT_USER_FILE
MINIO_ROOT_PASSWORD_FILE

# Writes every TLS session key to the file it names, which decrypts traffic
# captured from the same process. Debugging aid, never a deployment setting.
TLS_KEYLOG

# Skips the disk check that stops the server from claiming a filesystem it
# cannot store data on. The failure it suppresses is discovered later, as
# corrupt objects.
UNSAFE_BYPASS_DISK_CHECK

# Accepts upstream's development KMS defaults for key material, which is to say
# predictable keys. Encryption that an operator believes is real.
KMS_ALLOW_INSECURE_DEV_DEFAULTS