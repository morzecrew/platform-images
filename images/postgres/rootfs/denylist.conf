# Parameters the passthrough channel refuses outright, in both strict modes.
#
# Moved out of entrypoint.sh by RFC 0001 P4 (§5.4): this is data, and keeping it
# beside the allowlist is what lets a reader see the whole policy in one place.
# A key here is refused even if it also appears in allowlist.conf.

# This *setting* is generated at build time, into conf.d/10-extensions.conf, from
# PG_EXTENSIONS (RFC 0004 decision 1) -- this file is not: it ships as written and
# is the same for every extension variant. An operator setting the directive by
# hand would name a library the build never installed, which is a fatal startup
# error rather than a smaller image.
shared_preload_libraries

# The layering this image's precedence rule depends on.
include
include_dir
include_if_exists
config_file
hba_file
ident_file
data_directory
external_pid_file
unix_socket_directories

# Hardening and compatibility switches, fixed by product policy: each one
# changes how existing SQL behaves rather than how the server performs.
array_nulls
backslash_quote
escape_string_warning
lo_compat_privileges
quote_all_identifiers
standard_conforming_strings
synchronize_seqscans
transform_null_equals

# Configuration by SQL would bypass every rule above.
allow_alter_system
