# Upstream valkey.conf directives settable via VALKEY_CONF__<key>.
#
# Spelling here is the spelling written into valkey.conf -- this file is the
# authority (RFC 0001 §5.1). VALKEY_CONF__MAXMEMORY_POLICY and
# VALKEY_CONF__maxmemory-policy both match `maxmemory-policy` below and both
# render as `maxmemory-policy`, because matching is normalized and emitting is
# not. Note `server_cpulist` and friends really do use underscores; that is not
# a typo and is why the spelling cannot be derived.
#
# A trailing `!secret` redacts the value from the startup summary.
#
# Keys that a curated VALKEY_* variable also writes are listed here on purpose:
# an operator may use either channel, and setting *both* aborts naming both
# (RFC 0001 decision 11). Leaving them out would make the passthrough channel
# lie about what it accepts.

# --- the curated pairs; see images/valkey/README.md ---
maxmemory
maxmemory-policy
requirepass !secret
databases
loglevel
tcp-keepalive
appendfsync

# --- eviction and memory accounting ---
maxmemory-samples
maxmemory-clients
maxmemory-eviction-tenacity

# --- connection handling ---
timeout
tcp-backlog
io-threads

# --- latency and lazy freeing ---
hz
dynamic-hz
lazyfree-lazy-eviction
lazyfree-lazy-expire
lazyfree-lazy-server-del
lazyfree-lazy-user-del
lazyfree-lazy-user-flush

# --- observability ---
notify-keyspace-events
slowlog-log-slower-than
slowlog-max-len
latency-monitor-threshold

# --- protocol and buffers ---
proto-max-bulk-len
client-output-buffer-limit
client-query-buffer-limit

# --- CPU affinity; underscored upstream, deliberately ---
server_cpulist
bio_cpulist
aof_rewrite_cpulist
bgsave_cpulist
