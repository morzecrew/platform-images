# Directives nobody may set through VALKEY_CONF__*, regardless of the
# allowlist. A denylisted key aborts startup in **both** strict modes --
# VALKEY_CONF_STRICT=ignore governs unknown keys, not forbidden ones.
#
# Each entry is here because setting it would make some guarantee this image
# makes untrue, not because it is dangerous in general.

# Would load arbitrary config outside the allowlist, making the whole
# mechanism advisory.
include

# The image generates these from VALKEY_RENAME_DANGEROUS. A second, unordered
# source for the same directive means whether a command is disabled depends on
# emission order.
rename-command

# A daemonizing server detaches from PID 1, so the container exits while the
# process keeps running -- or, more often, the container exits immediately and
# takes the server with it.
daemonize

# The data directory is the image's contract with its volume mount. Moving it
# silently strands existing data at the old path.
dir

# Persistence is one switch with three values (RFC 0006 decision 2). Setting
# these directly reintroduces exactly the interacting-variables surface that
# decision exists to remove, and bypasses the §5.3 refusals.
appendonly
save

# Bound to the config file the entrypoint generates; pointing elsewhere means
# the running config is not the one this image reasoned about.
unixsocket
unixsocketperm
