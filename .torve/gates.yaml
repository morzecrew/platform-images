# yaml-language-server: $schema=schemas/gates.json
schema_version: 1

# The smoke and extension tests drive containers. Since torve 0.5.0 the gates
# sandbox runs beside a Docker daemon of its own (`runtime.docker: nested`), so
# `bake-smoke` builds and smoke-tests the targets a candidate touches. The
# extension and build-app batteries still run only in
# `.github/workflows/bake.yaml`.
tests:
  patterns:
    - "shared/test/**"
    - "images/*/smoke.sh"
    - "images/*/test-*.sh"

gates:
  - name: scope
    run: "@scope"
    state: blocking
    origin: structural
  - name: secrets
    run: "@secrets"
    state: blocking
    origin: structural
  - name: no-test-tampering
    run: "@no-test-tampering"
    state: blocking
    origin: structural
  - name: decisions-reported
    run: "@decisions-reported"
    state: blocking
    origin: structural
  # The env-config helper's own suite, which bake.yaml runs first.
  - name: env-helper
    run: "sh shared/test/run.sh -v"
    input: worktree
    state: blocking
    origin: structural
    timeout: 60
  # Errors only: at warning and below the base is already red.
  - name: shellcheck
    run: "git ls-files -z '*.sh' | xargs -0 shellcheck -S error"
    input: worktree
    state: blocking
    origin: structural
    timeout: 60
  - name: hadolint
    run: "git ls-files -z '*Dockerfile' | xargs -0 hadolint -t error"
    input: worktree
    state: blocking
    origin: structural
    timeout: 60
  # Every target resolves: variables, inheritance and contexts.
  - name: bake-definitions
    run: "docker buildx bake --print >/dev/null"
    input: worktree
    state: blocking
    origin: structural
    timeout: 60
  # The build's own judge, on the task's nested daemon: each bake target the
  # candidate touches, built once and smoke-tested (`.torve/gates/bake-smoke.sh`).
  # Entered at shadow and promoted with S-0002, whose image phases it judges.
  # Its record on 2026-10-21, under torve 0.6.0 in the lane's sandbox: green on
  # every run over valkey, caddy, the three postgres targets and uv-builder
  # (twelve runs, four slots side by side, cold and warm), where bake.yaml is
  # green too; red on valkey with `FLUSHALL` left enabled, which its smoke test
  # refuses. A shadow red lands anyway, which is what an image phase cannot have.
  - name: bake-smoke
    run: "bash .torve/gates/bake-smoke.sh {base}"
    input: worktree
    state: blocking
    origin: S-0002
    # A bake-file change rebuilds every target: 359s for all nine from a cold
    # daemon, rehearsed on dind 27.5.1 on 2026-10-21. One target took 32s.
    timeout: 1200
  - name: acceptance
    run: "@task.acceptance"
    state: blocking
    origin: structural
    timeout: 900
    # For a run with no task contract, and what a review round's fix task is
    # judged by: torve's review leg reads these, and with none it falls back to
    # `uv run pytest`, which this repository cannot run. S-0002's T-0007 spent
    # three attempts on "Failed to spawn: pytest". Builds are bake-smoke's.
    commands:
      - "sh shared/test/run.sh -v"
      - "docker buildx bake --print >/dev/null"
