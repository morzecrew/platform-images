# yaml-language-server: $schema=schemas/gates.json
schema_version: 1

# The smoke and extension tests drive containers. Since torve 0.5.0 the gates
# sandbox runs beside a Docker daemon of its own (`runtime.docker: nested`), so
# `bake-smoke` builds and smoke-tests the targets a candidate touches. The
# extension and build-app batteries still run only in
# `.github/workflows/bake.yaml`.
tests:
  patterns:
    - "shared/test/**"
    - "images/*/smoke.sh"
    - "images/*/test-*.sh"

gates:
  - name: scope
    run: "@scope"
    state: blocking
    origin: structural
  - name: secrets
    run: "@secrets"
    state: blocking
    origin: structural
  - name: no-test-tampering
    run: "@no-test-tampering"
    state: blocking
    origin: structural
  - name: decisions-reported
    run: "@decisions-reported"
    state: blocking
    origin: structural
  # The env-config helper's own suite, which bake.yaml runs first.
  - name: env-helper
    run: "sh shared/test/run.sh -v"
    input: worktree
    state: blocking
    origin: structural
    timeout: 60
  # Errors only: at warning and below the base is already red.
  - name: shellcheck
    run: "git ls-files -z '*.sh' | xargs -0 shellcheck -S error"
    input: worktree
    state: blocking
    origin: structural
    timeout: 60
  - name: hadolint
    run: "git ls-files -z '*Dockerfile' | xargs -0 hadolint -t error"
    input: worktree
    state: blocking
    origin: structural
    timeout: 60
  # Every target resolves: variables, inheritance and contexts.
  - name: bake-definitions
    run: "docker buildx bake --print >/dev/null"
    input: worktree
    state: blocking
    origin: structural
    timeout: 60
  # The build's own judge, on the task's nested daemon: each bake target the
  # candidate touches, built once and smoke-tested (`.torve/gates/bake-smoke.sh`).
  # Enters at shadow and is promoted on its record against bake.yaml's.
  - name: bake-smoke
    run: "bash .torve/gates/bake-smoke.sh {base}"
    input: worktree
    state: shadow
    origin: structural
    # A bake-file change rebuilds every target: 359s for all nine from a cold
    # daemon, rehearsed on dind 27.5.1 on 2026-10-21. One target took 32s.
    timeout: 1200
  - name: acceptance
    run: "@task.acceptance"
    state: blocking
    origin: structural
    timeout: 900
