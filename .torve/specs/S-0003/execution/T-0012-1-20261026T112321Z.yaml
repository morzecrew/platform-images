    at: '2026-10-26T11:18:30Z'
    claim: >-
      D-1's exec line cannot run on the pinned base image: the /bin/setpriv edoburu/pgbouncer
      carries is busybox's, which has no --reuid, --regid or --clear-groups and exits
      'unrecognized option: reuid=70'. The decision's mechanism is kept verbatim and
      made to work by installing Alpine's setpriv package, which is util-linux's binary
      and has all three; that needs root, so the Dockerfile switches USER before the
      RUN. Behaviour is exactly what D-1 specifies: root writes both files, chowns
      them to 70:70, and execs the pooler as uid 70.
    evidence: >-
      images/pgbouncer/Dockerfile:42-43 — the apk install added for this reason; `docker
      run --rm --user 0 --entrypoint sh edoburu/pgbouncer:v1.26.1-p0 -c "setpriv --reuid=70
      --regid=70 --clear-groups id"` printed "setpriv: unrecognized option: reuid=70"
      while the same command after the install prints "uid=70(postgres) gid=70(postgres)"
    action: departed
