  - decision: D-3
    grade: ASSUMED
    kind: departed
    class: spec-gap
    at: '2026-10-26T11:21:53Z'
    claim: >-
      S-0003/D-3's drop execs `setpriv --reuid=10001 --regid=10001 --clear-groups
      /entrypoint.sh rustfs`, which cannot run on this base image: upstream rustfs/rustfs:1.0.4
      is Alpine 3.24 and its /bin/setpriv is BusyBox's applet, which takes only --no-new-privs/--inh-caps/--ambient-caps
      and rejects --reuid. The flags are util-linux's. Alpine ships util-linux's binary
      in a separate `setpriv` package (2.42.3-r1), which installs /bin/setpriv over
      the busybox symlink, so the departure is to add that package to the image alongside
      the entrypoint the row already describes.
    evidence: >-
      `docker run --rm --user 0 --entrypoint sh rustfs/rustfs:1.0.4 -c 'readlink -f
      /bin/setpriv; /bin/setpriv --reuid=10001 --regid=10001 --clear-groups id'` —
      prints `/bin/busybox` then `/bin/setpriv: unrecognized option: reuid=10001`
      and BusyBox v1.37.0's usage; `apk add --no-cache setpriv` then resolves /bin/setpriv
      to util-linux 2.42.3 and the same command reports uid=10001
    action: departed
    proposal: >-
      Extend S-0003/D-3: images/rustfs installs Alpine's `setpriv` package (with the
      Dockerfile's apk step) so the drop's `setpriv --reuid=10001 --regid=10001 --clear-groups`
      resolves to util-linux's binary rather than the base image's BusyBox applet.
    notes: >-
      Found while running the new smoke section; the image builds and the root path
      otherwise works, so the drop's flags and the acceptance grep are unchanged.
