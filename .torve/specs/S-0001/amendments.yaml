      - subject: D-18
        field: fingerprint
        before: f576b12bfb3e19d5/9e62c124a404b61d
        after: f2199db5ed32310a/9e62c124a404b61d
    md: >-
      dotdash's gate is to reach an operator's WireGuard exit, such as a home router
      abroad, with no capability: Xray's own WireGuard runs over its built-in TCP/IP
      stack. Operators hold a wg-quick file, as providers and routers export it, so
      `$wireguard` turns that one secret file into the outbound's settings as `$proxy`
      turns a proxy line into a socks or http outbound's. It parses wg-quick's keys,
      leaves out those only wg-quick acts on (DNS, routes, scripts), refuses unknown
      ones, and names a line and a key in its errors, never a value.
