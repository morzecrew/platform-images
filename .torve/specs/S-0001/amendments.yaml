          path>"}` with the value that file yields, xray's also `{"$vlessDecryption":
          "<absolute path>"}`, `{"$vlessClients": "<absolute path>"}`, `{"$proxy":
          "<absolute path>"}` or `{"$wireguard": "<absolute path>"}`, and substitute
