          that file yields, and substitutes nothing else.
      - subject: D-18
        field: fingerprint
        before: 94ec24b1ba2f2202/f206374b70c16778
        after: 8a6d866ce3179170/f206374b70c16778
    md: >-
      dotdash wants one VLESS id per device, so that one device is revoked without
      re-keying the others. The ids are credentials and so a secret file, which an
      operator already edits with `morzer secret edit`. The new form keeps the row's
      line: it replaces one whole value, here the `clients` array, from a file of
      one `<uuid> [name]` per line, and adds no expression or second syntax. An id
      must be a canonical UUID, because Xray maps any other short string to a UUIDv5
      and a typo would lock its device out silently (#130).
  - id: A-6
    at: '2026-11-07T09:40:02Z'
