  - id: A-11
    at: '2026-11-09T13:38:15Z'
    title: >-
      shared/ holds a Go module for entrypoints with no shell
    changes:
      - subject: D-17
        field: text
        before: >-
          `shared/` holds only files two or more images use. They reach an image through
          the bake's named context `contexts = { shared = "./shared" }`, never by
          copy. The helper is POSIX sh and runs under busybox, dash and bash.
        after: >-
          `shared/` holds only files two or more images use. They reach an image through
          the bake's named context `contexts = { shared = "./shared" }`, never by
          copy. The helper is POSIX sh and runs under busybox, dash and bash. The
          Go module `shared/go` is standard library only, and an entrypoint module
          reaches it through a `replace` to the relative path its Dockerfile copies
          the context to.
      - subject: D-17
        field: fingerprint
        after: ecb50348d7da2e50/f218f9a22976a2d0
    md: >-
      The xray and mihomo entrypoints are Go binaries on distroless, with no shell
      to run envconf.sh. They share a resolver, a summary and a healthcheck, and the
      row's rule is that what two images use lives here and reaches them through the
      named context. So shared/go is a module, standard library only. Each entrypoint's
      go.mod replaces it with ../../../shared/go, and its Dockerfile copies the context
      to that place. One go.mod then works in a checkout and in the build, and the
      build runs the module's tests before the image is made.
  - id: A-12
    at: '2026-11-10T07:58:28Z'
    title: >-
      xray resolves a wg-quick file into a wireguard outbound ($wireguard)
    changes:
      - subject: D-18
        field: text
