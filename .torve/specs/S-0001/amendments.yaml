          a `variable` or `ARG` line in `docker-bake.hcl`, and the same annotation
          directly above each Dockerfile `ARG` default that copies the value. The
          dockerfile manager is off except for `docker/dockerfile`, Renovate reads
          patch tags only, and automerge is on except for Node and `alpine`. `ALPINE_VERSION`
          is a release, read with `versioning=docker` so that it moves to a release
          and never to a patch tag.
      - subject: D-23
        field: fingerprint
        before: e7b7be3ada85c237/c6970b5335db8cfe
        after: 6760c17f2a02c9af/c6970b5335db8cfe
    md: >-
      #146 moved `ALPINE_VERSION` from `3.22` to `3.24.4` and nothing else. Alpine
      3.24 ships openvpn 2.7.7, so the openvpn build refused it against `OPENVPN_VERSION`
      2.6.20, while the Repology name `alpine_3_22/openvpn` still named the old release.
      Renovate cannot move those two, and under `semver-coerced` it turned the floating
      release into a patch tag. With `versioning=docker` a candidate must have as
      many parts as `3.22`, and with automerge off a person finishes the pull request
      on its branch, including a release that happens to ship the same openvpn and
      would otherwise go green with a stale Repology name.
  - id: A-15
    at: '2026-11-11T14:59:37Z'
    title: >-
