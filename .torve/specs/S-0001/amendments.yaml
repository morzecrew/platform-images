  - id: A-3
    at: '2026-11-06T21:01:29Z'
    title: xray resolves file references, structurally
    changes:
      - subject: D-18
        field: paths
        before:
          - images/*/rootfs/entrypoint.sh
          - images/caddy/rootfs/Caddyfile
          - images/caddy/Dockerfile
        after:
          - images/*/rootfs/entrypoint.sh
          - images/caddy/rootfs/Caddyfile
          - images/caddy/Dockerfile
          - images/xray/entrypoint/main.go
      - subject: D-18
        field: text
        before: >-
          No entrypoint renders configuration through a templating engine; each image
          uses its server's native expansion.
        after: >-
          No entrypoint renders configuration through a templating engine; each image
          uses its server's native expansion. xray's server has none, so its entrypoint
          replaces a JSON object that is exactly `{"$file": "<absolute path>"}` or
          `{"$vlessDecryption": "<absolute path>"}` with the value that file yields,
          and substitutes nothing else.
      - subject: D-18
        field: fingerprint
        after: 94ec24b1ba2f2202/f206374b70c16778
    md: >-
      Xray reads no value from a file and expands no variable, so a secret reaches
      it only inside its JSON config, and its `-confdir` merge replaces an inbound
      whole rather than patching one field. The alternative, curated `*_FILE` variables
      rendered into generated fragments, would have made the image own the inbounds'
      shapes. The resolver keeps what the row is for: the input is valid JSON before
      and after, a reference replaces one whole value, and there is no environment
      expansion, expression or second syntax. A file is checked as a `_FILE` is and
      refused with exit 78 (#125).
