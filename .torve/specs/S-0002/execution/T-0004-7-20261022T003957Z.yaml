    attempt: 3
    claim: >-
      The prepared-statement case as reviewed would have failed rather than proved
      anything: `\bind_named` arms the next execution and performs none, so a file
      whose last two lines are `\bind_named` leaves psql with an empty query buffer
      at end of input — no binding is sent, no row is printed, and the two assertions
      on the statement's output have nothing to match. Each binding now carries its
      own `\g`, which is psql's own documented shape, so the named statement is bound
      and executed once per transaction and the two results are what shows PgBouncer
      held the name across server connections.
    evidence: >-
      images/pgbouncer/smoke.sh:250-252 — the three-line file: `SELECT $1::int + 1
      AS n \parse smoke_stmt`, then one `\bind_named smoke_stmt <value> \g` per execution;
      psql 18 documents the shape as `\bind_named stmt1 'first value' 'second value'
      \g`, and its main loop sends a trailing query buffer at end of input only while
      that buffer is non-empty.
    action: departed
    proposal: >-
      S-0002/D-9's smoke sentence should say how the prepared statement is proved:
      one named statement, parsed once and then bound and executed in two separate
      transactions, so the statement's name is what has to survive between them.
    notes: >-
      The claim the case makes is unchanged; only its mechanism is. The reviewed file
      sent the Parse and then nothing at all, so it was red rather than silently green.
