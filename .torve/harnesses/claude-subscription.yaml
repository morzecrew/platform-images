# yaml-language-server: $schema=../schemas/harness.json
# Claude Code in torve's published claude seat image, tagged with the harness
# version and the torve release it was built from. The image's own
# `/opt/torve/run` starts claude.
adapter: subscription
image: ghcr.io/morzecrew/claude-sandbox:2.1.283-torve0.5.0
equip_root: ~/.claude/skills
kinds: [skill, plugin, mcp, hook, agent]
env:
  # acceptEdits denies every other Bash call, silently, in print mode.
  CLAUDE_PERMISSION_MODE: bypassPermissions
  BASH_MAX_OUTPUT_LENGTH: "20000"
  MAX_MCP_OUTPUT_TOKENS: "5000"
  CLAUDE_TOOLS: Bash,Read,Edit,Write,Glob,Grep
api: [anthropic]
